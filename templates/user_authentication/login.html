{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In - BlogVerse{% endblock %}

{% block content %}
<style>
    .auth-card {
        background: #ffffff;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        padding: 2.5rem;
        max-width: 440px;
        margin: 2rem auto;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--primary-light);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 1rem;
    }

    .auth-title {
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--dark);
    }

    .auth-subtitle {
        color: var(--muted);
        font-size: 0.9rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 0.4rem;
        color: var(--dark);
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--muted);
    }
</style>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account to post & comment</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                <label for="password" style="margin-bottom: 0;">Password</label>
                <a href="{% url 'forgot_password' %}" style="font-size: 0.82rem; color: var(--primary);">Forgot password?</a>
            </div>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="{% url 'register' %}" style="font-weight: 600;">Create One</a>
    </div>
</div>
{% endblock %}
