{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - BlogVerse{% endblock %}

{% block content %}
<style>
    .auth-card {
        background: #ffffff;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        padding: 2.5rem;
        max-width: 440px;
        margin: 2rem auto;
    }
</style>

<div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800;">Set New Password</h1>
        <p style="color: var(--muted); font-size: 0.9rem;">Choose a strong new password for your account</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1.25rem;">
            <label for="password" style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem;">New Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required autofocus>
        </div>

        <div style="margin-bottom: 1.25rem;">
            <label for="confirm_password" style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem;">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            <i class="fa-solid fa-lock-open"></i> Reset Password
        </button>
    </form>
</div>
{% endblock %}
