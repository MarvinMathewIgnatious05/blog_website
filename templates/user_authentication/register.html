{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account - BlogVerse{% endblock %}

{% block content %}
<style>
    .auth-card {
        background: #ffffff;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        padding: 2.5rem;
        max-width: 550px;
        margin: 2rem auto;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #e0e7ff, #f3e8ff);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 1rem;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 0.4rem;
        color: var(--dark);
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--muted);
    }

    @media (max-width: 576px) {
        .form-row { grid-template-columns: 1fr; }
    }
</style>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800;">Join BlogVerse</h1>
        <p style="color: var(--muted); font-size: 0.9rem;">Start sharing your thoughts with the community today</p>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" name="first_name" id="first_name" class="form-control" placeholder="John">
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" name="last_name" id="last_name" class="form-control" placeholder="Doe">
            </div>
        </div>

        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="johndoe" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
            <label for="phone_number">Phone Number</label>
            <input type="text" name="phone_number" id="phone_number" class="form-control" placeholder="9876543210">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password *</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <div class="form-group">
            <label for="profile_picture">Profile Avatar (Optional)</label>
            <input type="file" name="profile_picture" id="profile_picture" class="form-control" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            <i class="fa-solid fa-check"></i> Register Account
        </button>
    </form>

    <div class="auth-footer">
        Already registered? <a href="{% url 'login' %}" style="font-weight: 600;">Sign In</a>
    </div>
</div>
{% endblock %}
