{% extends 'base.html' %}
{% load static %}

{% block title %}Recover Password - BlogVerse{% endblock %}

{% block content %}
<style>
    .auth-card {
        background: #ffffff;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        padding: 2.5rem;
        max-width: 440px;
        margin: 2rem auto;
    }
</style>

<div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #fef3c7; color: #b45309; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
            <i class="fa-solid fa-key"></i>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800;">Password Recovery</h1>
        <p style="color: var(--muted); font-size: 0.9rem;">Enter your username to begin password reset</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1.25rem;">
            <label for="username" style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem;">Username</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Continue <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        Remembered your password? <a href="{% url 'login' %}">Sign In</a>
    </div>
</div>
{% endblock %}
